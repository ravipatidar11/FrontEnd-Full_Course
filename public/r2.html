<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>

        body {

            display: grid;

            grid-template-columns: 2fr 10fr;

        }

        nav div {

            margin-bottom: 10px;

            margin-top: 10px;

        }

        nav img {

            border:1px solid gray;

            padding: 5px;

        }

        nav img:hover {

            border:2px solid rgb(43, 43, 75);

            cursor: grab;

        }

        .preview {

            display: none;

        }

        .preview:target {

            display: block;

        }

    </style>

</head>

<body>

    <nav>

    <div>

        <a href="#m1"><img src="./images/m1.png" width="80" height="80"></a>

    </div>

    <div>

        <a href="#m2"><img src="./images/m2.png" width="80" height="80"></a>

    </div>

    <div>

        <a href="#m3"><img src="./images/m3.png" width="80" height="80"></a>

    </div>

    </nav>

    <main>

        <img id="m1" class="preview" src="./images/m1.png">

        <img id="m2" class="preview" src="./images/m2.png">

        <img id="m3" class="preview" src="./images/m3.png">

    </main>

</body>

</html>
