<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <style>

        .flag {

            width: 24px;

        }

        .player-img {

            width: 100px;

        }

        table {

            font-family: Arial;

        }

        caption {

            margin-bottom: 40px;

            font-weight: bold;

            font-size: 20px;

            text-transform: uppercase;

        }

        .last-name {

            font-size: 25px;

            font-weight: bold;

        }

        .player-container {

            display: grid;

            grid-template-columns: 6fr 6fr;
            align-items: center;

        }

        .name-container span {

            display: block;
            align-items: center;

        }

        thead {

            color:white;

        }

        .last-name-2 {

                font-size: 15px;

                font-weight: bold;

        }

    </style>

</head>

<body>

<table width="100%" border="0"  cellspacing="0" cellpadding="10" frame="box">

    <caption>Men's T20 Batting Rankings</caption>

    <colgroup span="1"></colgroup>

    <thead bgcolor="blue">

            <tr height="40">

                <th width="20">Pos</th>

                <th>Team</th>

                <th width="250">Player</th>

                <th>Rating</th>

                <th>Career Best Rating</th>

            </tr>

    </thead>

    <tbody >

            <tr align="center" valign="center">

                <td>01</td>

                <td  >

                    <img src="./images/india-flag.png" class="flag">

                    <span class="team-name">IND</span>

                </td>

                <td>

                    <div class="player-container">

                        <div class="name-container">

                        <span class="first-name">Ishan</span>

                        <span class="last-name">KISHAN</span>

                        </div>

                        <div>

                            <img src="./images/ishan.png" class="player-img">

                        </div>

                    </div>

                </td>

                <td>876</td>

                <td>876 v Ireland at Belfast 2026</td>

            </tr>

            <tr align="center">

                <td>02</td>

                <td>

                    <img src="./images/india-flag.png" class="flag">

                    <span class="team-name">IND</span>

                </td>

                <td>

                    <div>

                        <span class="first-name">Abhishek</span>

                        <span class="last-name-2">SHARMA</span>

                    </div>

                </td>

                <td>869</td>

                <td>931 v Sri Lanka at Dubai 2025</td>

            </tr>

    </tbody>

    <tfoot>

            <tr>

                <td colspan="5" align="center" bgcolor="yellow">

                    &copy; copyright ICC 2026

                </td>

            </tr>

    </tfoot>

</table>

</body>

</html>
