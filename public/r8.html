<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>

        ul {

            list-style: none;

            

        }

        li {

            width: 50px;

            border:1px solid gray;

            padding: 5px;

            margin-bottom: 10px;

        }

        li:nth-last-of-type(3n+4) {

            background-color: yellow;

        }

    </style>

</head>

<body>

    <ul>

        <li>1</li>

        <li>2</li>

        <li>3</li>

        <li>4</li>

        <li>5</li>

        <li>6</li>

        <li>7</li>

        <li>8</li>

        <li>9</li>

        <li>10</li>

    </ul>

</body>

</html>
