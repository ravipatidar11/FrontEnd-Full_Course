<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <style>

        body {

            display: flex;

            flex-direction: row;

            justify-content: center;

        }

        form {

            margin-top: 30px;

            padding: 20px;

            border:1px solid gray;

            border-radius: 5px;

            width: 250px;

            font-family: Arial;

        }

        .bi-person-fill {

            font-size: 25px;

            font-weight: bold;

            margin-bottom: 20px;

        }

        .form-field {

            margin-bottom: 25px;

        }

        .form-control {

            font-size: 20px;

            padding: 5px;

            width: 90%;

        }

        .btn-register {

            width: 100%;

            background-color: goldenrod;

            color:white;

            padding: 5px;

            font-size: 20px;

            border:none;

        }

        .form-label {

            margin-bottom: 5px;

            display: block;

            font-weight: bold;

        }

    </style>

</head>

<body>

    <form>

        <div class="bi bi-person-fill"> User Register </div>

        <div class="form-field">

            <label class="form-label">User Name</label>

            <div>

                <input type="text" class="form-control">

            </div>

        </div>

        <div class="form-field">

            <label class="form-label">Password</label>

            <div>

                <input type="password" class="form-control">

            </div>

        </div>

        <div class="form-field">

            <label class="form-label">Mobile</label>

            <div>

                <input type="text" class="form-control">

            </div>

        </div>

        <div class="form-field">

            <label class="form-label">Your City</label>

            <div>

                <select class="form-control">

                    <option>City Name</option>

                    <option>Delhi</option>

                    <option>Hyd</option>

                </select>

            </div>

        </div>

        <div class="form-field">

            <button class="btn-register">Register</button>

        </div>

        <div>

            <hr size="2" noshade color="black">

            <p>adipisicing elit. Quam labore, at ad libero minus perspiciatis beatae magni consequatur nemo veritatis unde nulla velit, </p>

        </div>

    </form>

</body>

</html>
