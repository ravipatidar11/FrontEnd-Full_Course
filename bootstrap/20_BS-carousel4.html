<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

     <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>

</head>

<body>

    <div class="carousel slide" id="banners" data-bs-theme="dark" data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active" data-bs-interval="4000">

                <img src="../public/Images/slide1.png" height="300" class="w-100">

            </div>

            <div class="carousel-item" data-bs-interval="1000">

                <img src="../public/Images/slide2.png" height="300" class="w-100">

            </div>

            <div class="carousel-item" data-bs-interval="6000">

                <div style="height: 300px;" class="d-flex flex-row justify-content-center align-items-center">

                    <h1>Welcome to Amazon</h1>

                </div>

            </div>

            <div class="carousel-item" data-bs-interval="6000">

                <img src="../public/Images/slide3.png" height="300" class="w-100">

            </div>

        </div>

        <button class="carousel-control-prev" data-bs-slide="prev" data-bs-target="#banners">

            <span class="carousel-control-prev-icon"></span>

        </button>   

        <button class="carousel-control-next" data-bs-slide="next" data-bs-target="#banners">

            <span class="carousel-control-next-icon"></span>

        </button>

        <div class="carousel-indicators">

            <button style="width: 20px; height: 20px; border-radius: 100%" class="active" data-bs-slide-to="0" data-bs-target="#banners"></button>

            <button style="width: 20px; height: 20px; border-radius: 100%" data-bs-slide-to="1" data-bs-target="#banners"></button>

            <button style="width: 20px; height: 20px; border-radius: 100%" data-bs-slide-to="2" data-bs-target="#banners"></button>

            <button style="width: 20px; height: 20px; border-radius: 100%" data-bs-slide-to="3" data-bs-target="#banners"></button>

        </div>

    </div>

</body>

</html>
