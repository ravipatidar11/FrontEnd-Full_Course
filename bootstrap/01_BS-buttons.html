<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>

</head>

<body class="p-2">

    <nav class="btn-toolbar bg-danger">

        <div class="btn-group">

            <button class="btn btn-danger">Amazon</button>

        </div>

        <div class="btn-group">

            <button class="btn btn-danger">Home</button>

            <button class="btn btn-danger">Shop</button>

            <button class="btn btn-danger">Offers</button>

            <button class="btn btn-danger">Brands</button>

        </div>

    </nav>

     <dl>

        <dt>Base class</dt>

        <dd><button class="btn">Submit</button></dd>

        <dt>Contextual</dt>

        <dd>

            <button class="btn btn-primary">Insert</button>

            <button class="btn btn-warning">Update</button>

            <button class="btn btn-danger">Delete</button>

        </dd>

        <dt>Outline Contextual</dt>

        <dd>

            <button class="btn btn-outline-primary">Insert</button>

            <button class="btn btn-outline-warning btn-sm">Update</button>

            <button class="btn btn-outline-danger btn-lg">Delete</button>

        </dd>

        <dt>Special</dt>

        <dd>

            <button class="btn btn-link">Signout</button>

            <button class="btn btn-close" ></button>

        </dd>

        <dt>Group</dt>

        <dd class="btn-group-vertical">

            <button class="btn btn-danger bi bi-play"></button>

            <button class="btn btn-danger bi bi-pause"></button>

            <button class="btn btn-danger bi bi-stop"></button>

        </dd>

     </dl>

</body>

</html>
