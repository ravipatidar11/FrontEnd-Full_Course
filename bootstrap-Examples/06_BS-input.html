<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

     <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>

</head>

<body class="p-3">

    <div class="w-50 input-group">

        <select class="input-group-text">

            <option>All</option>

        </select>

        <input type="text" placeholder="eg: brands, products, categories" class="form-control">

        <button class="btn btn-warning bi bi-search"></button>

    </div>

    <div class="mt-4 w-25 input-group">

        <span class="bi input-group-text bi-person-fill"></span>

        <input type="text" placeholder="User Name" class="form-control">

        <span class="input-group-text"> <input type="checkbox"> </span>

    </div>

    <div class="mt-4 w-25 input-group">

        <span class="bi input-group-text bi-key-fill"></span>

        <input type="password" placeholder="Password" class="form-control">

        <span class="input-group-text"> <input type="checkbox"> </span>

    </div>

</body>

</html>
