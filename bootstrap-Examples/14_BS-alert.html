<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>

</head>

<body class="p-2">

    <h2>Alerts</h2>

    <aside class="alert alert-warning alert-dismissible w-25">

        <h4>Ads</h4>

        <button data-bs-dismiss="alert" class="btn btn-close"></button>

        <img src="../public/Images/Java.jpg" width="100%"> 

    </aside>

    <div class="alert alert-success alert-dismissible w-50">

        <h3 class="alert-title">Registered Successfully</h3>

        <button data-bs-dismiss="alert" class="btn btn-close"></button>

        <p>Your account created and activated.</p>

        <a class="alert-link"> <span class="bi bi-question-circle"></span> Help</a>

        <br><br>

        <button data-bs-dismiss="alert" class="btn btn-success">OK</button>

    </div>

    <div class="alert alert-danger alert-dismissible w-50">

        <h2>Deleted Record</h2>

        <p>Record deleted successfully..</p>

        <button data-bs-dismiss="alert" class="btn btn-danger">OK</button>

    </div>

</body>

</html>
