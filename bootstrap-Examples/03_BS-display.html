<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap</title>

    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>

</head>

<body class="p-2">

    <header class="border border-2 bg-danger text-white border-light p-2 rounded d-flex flex-row justify-content-between align-items-center">

        <div>

            <span class="bi bi-bag-fill"> Shopping</span>

        </div>

        <div>

            <nav>

                <span>Home</span>

                <span class="mx-3">Offers</span>

                <span>Shop</span>

                <span class="mx-3">Brands</span>

                <span>Contact</span>

            </nav>

        </div>

        <div>

            <span class="bi bi-person-fill"></span>

            <span class="bi mx-4 bi-heart-fill"></span>

            <span class="bi bi-cart4"></span>

        </div>

    </header>

    <section>

        <nav class="d-flex mt-3 bg-dark text-white p-3 flex-column justify-content-between" style="width: 200px; height:400px;">

            <div>

                <h5 class="bi bi-amazon"> Amazon</h5>

            </div>

            <div>

                <div class="bg-light p-2 w-100 my-4 text-dark">

                Electronics

                </div>

                <div class="bg-light p-2 w-100 my-4 text-dark">

                    Footwear

                </div>

                <div class="bg-light p-2 w-100 my-4 text-dark">

                    Fashion

                </div>

                <div class="bg-light p-2 w-100 my-4 text-dark">

                    Offers

                </div>

            </div>

            <div>

                <button class="w-100">Signout</button>

            </div>

        </nav>

    </section>

</body>

</html>
