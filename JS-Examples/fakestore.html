<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fakestore | Online Store</title>

    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>

    <script src="../src/scripts/fakestore.js"></script>

</head>

<body class="container-fluid" onload="bodyload()">

<header class="p-3 border bg-light border-1 align-items-center d-flex justify-content-between">

    <span class="bi bi-bag-fill text-dark fs-3"> Fakestore </span>

    <div>

        <div class="input-group">

            <input type="text" onkeyup="SearchClick()" class="form-control" id="txtSearch" placeholder="Search fakestore">

            <button onclick="SearchClick()" class="btn btn-warning bi bi-search"></button>

        </div>

    </div>

    <div>

        <button onclick="ShowCartItems()" data-bs-target="#cart" data-bs-toggle="offcanvas" class="btn btn-warning bi bi-cart4 position-relative"> <span class="badge rounded rounded-circle bg-danger position-absolute" id="lblCount"></span> </button>

        <div class="offcanvas offcanvas-end" id="cart">

            <div class="offcanvas-header">

                <h3>Your Cart Items</h3>

                <button class="btn btn-close" data-bs-dismiss="offcanvas"></button>

            </div>

            <div class="offcanvas-body">

                <table class="table table-hover">

                    <thead>

                        <tr>

                            <th>Title</th>

                            <th>Preview</th>

                        </tr>

                    </thead>

                    <tbody>



                    </tbody>

                </table>

            </div>

        </div>

    </div>

</header>

<section class="mt-3 row">

    <nav class="col-2">

        <label>Select Category</label>

        <div>

            <select onchange="handleCategoryChange()" class="form-select" id="lstCategories">



            </select>

        </div>

        <div class="mt-3">

            <ul class="list-group">

                <li class="list-group-item list-group-item-light"> <input type="checkbox" class="form-check-input"> <label>>4 <span class="bi bi-star-fill text-success"> Rating</span> </label> </li>

                <li class="list-group-item my-3 list-group-item-light"> <input type="checkbox" class="form-check-input"> <label>3 <span class="bi bi-star-fill text-success"> Rating</span> </label> </li>

                <li class="list-group-item list-group-item-light"> <input type="checkbox" class="form-check-input"> <label>2 <span class="bi bi-star-fill text-success"> Rating</span> </label> </li>

            </ul>

        </div>



        <div class="mt-3">

            <label class="form-label fw-bold">Price</label>

            <ul class="list-group">

                <li class="list-group-item list-group-item-light">

                    Min <input type="range"> Max

                </li>

            </ul>

        </div>

    </nav>

    <main class="col-10 overflow-auto flex-row align-items-baseline d-flex flex-wrap" style="height: 550px;">



    </main>

</section>

</body>

</html>
